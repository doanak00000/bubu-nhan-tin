<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhắn LuLu 🐻</title>
<style>
  :root { --pink: #d6336c; --soft: #fff0f5; --ink: #333; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--soft); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: #fff; border: 2px solid var(--ink);
         border-radius: 20px; padding: 20px; box-shadow: 6px 6px 0 #f7a8c4; }
  h1 { margin: 0 0 12px; color: var(--pink); font-size: 1.5rem; text-align: center; }
  textarea { width: 100%; min-height: 110px; padding: 12px; font: inherit; font-size: 1rem;
             border: 2px solid var(--ink); border-radius: 14px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .chips button { border: 1.5px solid var(--pink); background: var(--soft); color: var(--pink);
                  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  #send { width: 100%; padding: 14px; border: 2px solid var(--ink); border-radius: 14px; background: var(--pink);
          color: #fff; font: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  #send:disabled { opacity: .6; }
  .hint { display: block; margin-bottom: 8px; color: #888; font-size: .9rem; text-align: center; }
  #status { min-height: 1.4em; margin: 12px 0 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>🐻 Nhắn cho LuLu</h1>
  <label for="msg" class="hint">Lời nhắn sẽ hiện ngay trên máy tính bên kia</label>
  <textarea id="msg" maxlength="300" placeholder="Viết gì đó cute vào đây..."></textarea>
  <div class="chips">
    <button type="button">Nhớ Lu ghê 🥺</button>
    <button type="button">Uống nước đi nè 💧</button>
    <button type="button">Ăn cơm chưa đó? 🍚</button>
    <button type="button">Thương nhiều lắm 💕</button>
    <button type="button">Làm việc vừa thôi nha 😤</button>
  </div>
  <button id="send">Gửi 💌</button>
  <p id="status" role="status"></p>
</main>
<script>
  // mã kênh nằm sau dấu # trong link: không bị gửi lên server hosting, không nằm trong code
  const topic = decodeURIComponent(location.hash.slice(1));
  const msg = document.getElementById("msg"), send = document.getElementById("send"), status = document.getElementById("status");
  if (!/^[\w-]{10,64}$/.test(topic)) {
    send.disabled = true;
    status.textContent = "Link thiếu mã rồi, xin lại link đầy đủ nha 🥲";
  }
  document.querySelectorAll(".chips button").forEach(b => b.onclick = () => { msg.value = b.textContent; msg.focus(); });
  send.onclick = async () => {
    const text = msg.value.trim();
    if (!text) { status.textContent = "Viết gì đó đã nè ✍️"; return; }
    send.disabled = true;
    status.textContent = "Đang gửi...";
    try {
      const r = await fetch("https://ntfy.sh/" + topic, { method: "POST", body: text });
      if (!r.ok) throw new Error(r.status);
      status.textContent = "Đã gửi! LuLu sẽ thấy ngay trên máy 🐻💨";
      msg.value = "";
    } catch (e) {
      status.textContent = "Gửi không được (" + e.message + "), thử lại xíu nha 😢";
    }
    send.disabled = false;
  };
</script>
</body>
</html>
